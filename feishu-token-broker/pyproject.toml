[project]
name = "feishu-token-broker"
version = "0.1.0"
description = "Feishu Token Broker: holds the user refresh token server-side and hands out short-lived user_access_token"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
feishu-token-broker = "feishu_token_broker.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
